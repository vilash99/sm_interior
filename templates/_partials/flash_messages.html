{% if messages %}
  <div
    id="toast-container"
    class="fixed top-20 right-4 z-50 space-y-2 w-80"
  >
    {% for message in messages %}
      <div
        class="toast flex items-start justify-between gap-3 px-4 py-3 border rounded-md text-sm shadow-lg transition-opacity duration-500
        {% if message.tags == 'success' %}
          bg-green-50 border-green-200 text-green-800
        {% elif message.tags == 'error' %}
          bg-red-50 border-red-200 text-red-800
        {% elif message.tags == 'warning' %}
          bg-yellow-50 border-yellow-200 text-yellow-800
        {% elif message.tags == 'info' %}
          bg-blue-50 border-blue-200 text-blue-800
        {% else %}
          bg-gray-50 border-gray-200 text-gray-800
        {% endif %}
        "
        role="alert"
      >
        <div class="flex items-start gap-2">
          {% if message.tags == 'success' %}
            <i class="fas fa-check-circle mt-0.5"></i>
          {% elif message.tags == 'error' %}
            <i class="fas fa-circle-xmark mt-0.5"></i>
          {% elif message.tags == 'warning' %}
            <i class="fas fa-triangle-exclamation mt-0.5"></i>
          {% elif message.tags == 'info' %}
            <i class="fas fa-circle-info mt-0.5"></i>
          {% endif %}

          <span class="leading-snug">
            {{ message }}
          </span>
        </div>

        <button
          type="button"
          class="ml-2 text-xs text-gray-500 hover:text-gray-700"
          aria-label="Dismiss notification"
          onclick="this.closest('.toast').remove()"
        >
          <i class="fas fa-xmark"></i>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
