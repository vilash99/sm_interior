{% extends "_base.html" %}

{% block title %}
Page Not Found
{% endblock title %}

{% block content %}

<div class="flex flex-col items-center justify-center py-20 px-4">
  <div class="text-center max-w-md">
    <h1 class="text-5xl font-bold text-gray-600 mb-4">
      404
    </h1>

    <h2 class="text-2xl font-semibold text-gray-900 mb-3">
      Page Not Found
    </h2>

    <p class="text-gray-600 mb-6">
      The page you're looking for doesn't exist or may have been moved.
    </p>

    <a href="/"
       class="inline-block px-5 py-2 rounded-md bg-gray-900 text-white hover:bg-gray-800 transition">
      Go to Dashboard
    </a>
  </div>
</div>

{% endblock content %}
